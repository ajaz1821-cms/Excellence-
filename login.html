<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | Academy of Excellence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; overflow: hidden; }
        .glass-card { background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.3); }
        #three-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.3; }
        .input-focus:focus { border-color: #f97316; ring: 2px; ring-color: rgba(249, 115, 22, 0.2); }
    </style>
</head>
<body class="text-slate-900 h-screen flex items-center justify-center p-6">
    <div id="three-container"></div>

    <div class="max-w-md w-full" data-aos="zoom-in">
        <div class="text-center mb-10">
            <a href="index.html" class="inline-block mb-6">
                <img src="/logo.png" alt="A.O.E" class="h-16 w-auto mx-auto">
            </a>
            <h1 class="text-3xl font-black text-slate-950 uppercase tracking-tight">Student Portal</h1>
            <p class="text-slate-500 font-medium mt-2">Enter your credentials to access your dashboard</p>
        </div>

        <div class="glass-card p-10 rounded-[2.5rem] shadow-2xl">
            <form id="login-form" class="space-y-6">
                <div>
                    <label class="block text-xs font-black uppercase tracking-widest text-slate-700 mb-2">Student ID</label>
                    <div class="relative">
                        <i data-lucide="user" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                        <input type="text" placeholder="AOE-2024-XXXX" class="w-full pl-12 pr-4 py-4 rounded-2xl bg-white/50 border border-slate-200 outline-none transition-all input-focus font-bold">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-black uppercase tracking-widest text-slate-700 mb-2">Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                        <input type="password" placeholder="••••••••" class="w-full pl-12 pr-4 py-4 rounded-2xl bg-white/50 border border-slate-200 outline-none transition-all input-focus font-bold">
                    </div>
                </div>

                <div class="flex items-center justify-between text-xs font-bold uppercase tracking-widest">
                    <label class="flex items-center gap-2 cursor-pointer text-slate-500 hover:text-slate-950 transition-colors">
                        <input type="checkbox" class="accent-orange-500"> Remember me
                    </label>
                    <a href="#" class="text-orange-500 hover:text-orange-600">Forgot Password?</a>
                </div>

                <button type="submit" class="w-full py-4 bg-slate-950 text-white rounded-2xl font-black uppercase tracking-[0.2em] hover:bg-orange-600 transition-all transform hover:-translate-y-1 shadow-xl hover:shadow-orange-500/20">
                    Secure Login
                </button>
            </form>

            <div class="mt-8 text-center pt-8 border-t border-white/20">
                <p class="text-xs font-bold text-slate-500 uppercase tracking-widest">
                    New student? <a href="index.html#contact" class="text-orange-500">Contact Administration</a>
                </p>
            </div>
        </div>

        <a href="index.html" class="flex items-center justify-center gap-2 text-slate-500 hover:text-orange-500 font-black uppercase text-xs tracking-widest mt-12 transition-colors group">
            <i data-lucide="arrow-left" class="w-4 h-4 group-hover:-translate-x-1 transition-transform"></i> Back to website
        </a>
    </div>

    <script>
        AOS.init({ duration: 1000 });
        lucide.createIcons();

        // 3D Background
        const initThree = () => {
            const container = document.getElementById('three-container');
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);
            const geometry = new THREE.PlaneGeometry(25, 25, 50, 50);
            const material = new THREE.MeshBasicMaterial({ color: 0x334155, wireframe: true, transparent: true, opacity: 0.1 });
            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);
            mesh.rotation.x = -Math.PI / 3;
            camera.position.z = 8;
            const originalPositions = geometry.attributes.position.array.slice();
            const animate = () => {
                requestAnimationFrame(animate);
                const time = Date.now() * 0.0004;
                const positions = geometry.attributes.position.array;
                for (let i = 0; i < positions.length; i += 3) {
                    const x = originalPositions[i], y = originalPositions[i + 1];
                    positions[i + 2] = Math.sin(x + time) * 0.4 + Math.cos(y + time) * 0.4;
                }
                geometry.attributes.position.needsUpdate = true;
                mesh.rotation.z += 0.0005;
                renderer.render(scene, camera);
            };
            animate();
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
            });
        };
        initThree();

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Login functionality would be connected to the backend.');
        });
    </script>
</body>
</html>
