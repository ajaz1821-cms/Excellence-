<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login | Academy of Excellence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body{font-family:Inter,sans-serif;background:linear-gradient(135deg,#f8fafc,#fff7ed);min-height:100vh}
    .glass{background:rgba(255,255,255,.78);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.75)}
    .focus-orange:focus{border-color:#f97316;box-shadow:0 0 0 3px rgba(249,115,22,.12);outline:none}
  </style>
</head>
<body class="text-slate-900 flex items-center justify-center p-6">
  <main class="max-w-md w-full">
    <div class="text-center mb-8">
      <a href="index.html" class="inline-block mb-5"><img src="/logo.png" alt="Academy of Excellence" class="h-16 w-auto mx-auto"></a>
      <h1 class="text-3xl font-black uppercase tracking-tight">Student Portal</h1>
      <p class="text-slate-500 font-medium mt-2">Sign in to access your profile, homework, marks, and classroom.</p>
    </div>
    <section class="glass p-8 sm:p-10 rounded-[2rem] shadow-2xl">
      <form id="login-form" class="space-y-5">
        <label class="block text-xs font-black uppercase tracking-widest text-slate-700">Student ID
          <input id="student-id" required type="text" placeholder="AOE-2024-XXXX" class="focus-orange mt-2 w-full px-4 py-4 rounded-xl bg-white/70 border border-slate-200 font-bold">
        </label>
        <label class="block text-xs font-black uppercase tracking-widest text-slate-700">Password
          <input id="student-password" required type="password" placeholder="Enter your password" class="focus-orange mt-2 w-full px-4 py-4 rounded-xl bg-white/70 border border-slate-200 font-bold">
        </label>
        <p id="login-error" class="hidden text-sm text-red-600 bg-red-50 rounded-xl px-4 py-3">Please enter both your Student ID and password.</p>
        <button type="submit" class="w-full py-4 bg-slate-950 text-white rounded-xl font-black uppercase tracking-[0.15em] hover:bg-orange-600 transition-all">Continue to student portal</button>
      </form>
      <div class="mt-7 pt-6 border-t border-slate-200 text-center">
        <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Demo access</p>
        <p class="text-xs text-slate-600 mt-2"><strong>AOE-2024-0148</strong> · <strong>excellence</strong></p>
      </div>
    </section>
    <a href="index.html" class="flex items-center justify-center text-slate-500 hover:text-orange-500 font-black uppercase text-xs tracking-widest mt-8">← Back to academy website</a>
  </main>
  <script>
    // Update this value after deploying the Excellence-Student-Portal repository.
    const PORTAL_URL = 'https://ajaz1821-cms.github.io/Excellence-Student-Portal/';
    document.getElementById('login-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const id = document.getElementById('student-id').value.trim();
      const password = document.getElementById('student-password').value;
      const error = document.getElementById('login-error');
      if (!id || !password) { error.classList.remove('hidden'); return; }
      error.classList.add('hidden');
      const destination = new URL(PORTAL_URL);
      destination.searchParams.set('studentId', id);
      window.location.href = destination.toString();
    });
  </script>
</body>
</html>
