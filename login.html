<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | Academy of Excellence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Montserrat:wght@800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; overflow: hidden; }
        .glass-card { background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .glass-nav { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.2); }
        #three-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.3; }
        
        .input-field {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        .input-field:focus {
            background: rgba(255, 255, 255, 0.8);
            border-color: #f97316;
            outline: none;
            box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.1);
        }
    </style>
</head>
<body class="text-slate-900 flex items-center justify-center min-h-screen p-6">
    <div id="three-container"></div>

    <div class="w-full max-w-md" data-aos="zoom-in">
        <div class="text-center mb-10">
            <a href="index.html" class="inline-block mb-6">
                <img src="/logo.png" alt="A.O.E" class="h-16 w-auto">
            </a>
            <h1 class="text-3xl font-black text-slate-950 uppercase tracking-tight">Student Login</h1>
            <p class="text-slate-500 font-medium mt-2">Enter your credentials to access your dashboard</p>
        </div>

        <form class="glass-card p-8 md:p-10 rounded-[2.5rem] shadow-2xl space-y-6">
            <div>
                <label class="block text-xs font-bold uppercase tracking-widest text-slate-700 mb-2">User ID</label>
                <div class="relative text-slate-400 focus-within:text-orange-500 transition-colors">
                    <i data-lucide="user" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5"></i>
                    <input type="text" placeholder="Enter Enrollment No." class="input-field w-full pl-12 pr-4 py-4 rounded-2xl font-medium text-slate-900">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-widest text-slate-700 mb-2">Password</label>
                <div class="relative text-slate-400 focus-within:text-orange-500 transition-colors">
                    <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5"></i>
                    <input type="password" placeholder="••••••••" class="input-field w-full pl-12 pr-4 py-4 rounded-2xl font-medium text-slate-900">
                </div>
            </div>

            <div class="flex items-center justify-between text-xs font-bold uppercase tracking-widest">
                <label class="flex items-center gap-2 cursor-pointer group">
                    <input type="checkbox" class="accent-orange-500">
                    <span class="text-slate-500 group-hover:text-slate-900 transition-colors">Remember Me</span>
                </label>
                <a href="#" class="text-orange-500 hover:text-orange-600 transition-colors">Forgot Password?</a>
            </div>

            <button type="submit" class="w-full py-5 bg-slate-950 text-white rounded-2xl font-black uppercase tracking-[0.2em] hover:bg-orange-600 transition-all shadow-xl active:scale-95">
                Login Now
            </button>
        </form>

        <p class="text-center mt-8 text-xs font-bold uppercase tracking-widest text-slate-400">
            Don't have an account? <a href="index.html#contact" class="text-orange-500 hover:underline">Contact Admin</a>
        </p>
    </div>

    <script>
        AOS.init({ duration: 1000, once: true });
        lucide.createIcons();
        
        // 3D Background Logic
        const initThree = () => {
            const container = document.getElementById('three-container');
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);
            const geometry = new THREE.PlaneGeometry(25, 25, 50, 50);
            const material = new THREE.MeshBasicMaterial({ color: 0x334155, wireframe: true, transparent: true, opacity: 0.12 });
            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);
            mesh.rotation.x = -Math.PI / 3;
            camera.position.z = 8;
            const originalPositions = geometry.attributes.position.array.slice();
            const animate = () => {
                requestAnimationFrame(animate);
                const time = Date.now() * 0.0004;
                const positions = geometry.attributes.position.array;
                for (let i = 0; i < positions.length; i += 3) {
                    const x = originalPositions[i], y = originalPositions[i + 1];
                    positions[i + 2] = Math.sin(x + time) * 0.4 + Math.cos(y + time) * 0.4;
                }
                geometry.attributes.position.needsUpdate = true;
                mesh.rotation.z += 0.0005;
                renderer.render(scene, camera);
            };
            animate();
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
            });
        };
        initThree();
    </script>
</body>
</html>
